name: One-shot — DB schema + backfill from S3 masters

# WHAT THIS DOES:
#   1. Creates url_features / dns_features / whois_features tables in RDS
#      (idempotent — safe to re-run).
#   2. TRUNCATEs each table and reloads it from the current S3 master CSV
#      via psycopg2 COPY (streams row-by-row, doesn't blow the runner's RAM).
#   3. Verifies row counts match between COPY and SELECT COUNT(*).
#
# WHEN TO RUN:
#   - Once, after this PR merges, to migrate the pipeline off CSV-in-S3 and
#     onto Postgres.
#   - Again ONLY if the schema changes, or if you want to force a re-sync
#     from S3 masters back into the DB. Note: it TRUNCATEs, so it will
#     WIPE any daemon-inserted data that isn't also in the S3 masters.
#     Don't run this if the daemon has already ingested data past what's
#     in S3.

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  S3_BUCKET: phishnet-data

jobs:
  backfill:
    name: Apply schema + backfill from S3 masters
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install psycopg2-binary boto3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Apply schema + backfill from S3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          S3_BUCKET: ${{ env.S3_BUCKET }}
        run: python scripts/backfill_masters_to_db.py

      - name: Compare DB row counts to S3 CSV row counts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "=== Row counts from S3 CSVs (bytes → wc -l - 1 for header) ==="
          for m in url_features_master.csv dns_features_master.csv whois_features_master.csv; do
            aws s3 cp --quiet s3://${{ env.S3_BUCKET }}/master/$m /tmp/$m
            n=$(( $(wc -l < /tmp/$m) - 1 ))
            printf "  %-32s  %d rows in CSV\n" "$m" "$n"
          done
          echo
          echo "=== Row counts from Postgres ==="
          python3 << 'PY'
          import os, psycopg2
          conn = psycopg2.connect(os.environ["DATABASE_URL"], connect_timeout=15)
          with conn.cursor() as cur:
              for t in ("url_features", "dns_features", "whois_features"):
                  cur.execute(f"SELECT COUNT(*) FROM {t}")
                  (n,) = cur.fetchone()
                  print(f"  {t:20s}  {n} rows in DB")
              cur.execute("SELECT COUNT(*) FROM phishing_features")
              (n,) = cur.fetchone()
              print(f"  phishing_features (view)  {n} rows joined")
          conn.close()
          PY
