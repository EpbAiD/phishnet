name: Unified ML Pipeline

# Single configurable pipeline - reads .github/pipeline_config.yml
# Change frequencies in config file instead of editing workflow
# Uses AWS (EC2, S3, RDS) for infrastructure

on:
  schedule:
    # Twice daily — collects new URLs and grows the DNS/WHOIS masters.
    # Aggressive-catch-up ratio keeps favoring legit URLs until the master
    # reaches 50/50, which is what the realistic-prior gates are waiting on.
    - cron: '0 11 * * *'     # 6 AM EST (11:00 UTC)
    - cron: '0 23 * * *'     # 6 PM EST (23:00 UTC)

  workflow_dispatch:
    inputs:
      override_stage:
        description: 'Force run specific stage (data/features/training/deploy/all)'
        required: false
        default: 'all'
      num_urls:
        description: 'Override num_urls from config'
        required: false

concurrency:
  group: unified-pipeline-ec2
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  S3_BUCKET: phishnet-data
  EC2_INSTANCE_ID: i-0340d8051273ce3d5
  EC2_HOST: 3.92.88.199
  CONFIG_FILE: .github/pipeline_config.yml

jobs:
  # ========================================================================
  # JOB 1: Load Configuration
  # ========================================================================
  load-config:
    name: Load Pipeline Configuration
    runs-on: ubuntu-latest
    outputs:
      data_collection_freq: ${{ steps.parse.outputs.data_collection_freq }}
      feature_extraction_freq: ${{ steps.parse.outputs.feature_extraction_freq }}
      model_training_freq: ${{ steps.parse.outputs.model_training_freq }}
      deployment_freq: ${{ steps.parse.outputs.deployment_freq }}
      num_urls: ${{ steps.parse.outputs.num_urls }}
      mode: ${{ steps.parse.outputs.mode }}
      should_run_data: ${{ steps.decide.outputs.should_run_data }}
      should_run_training: ${{ steps.decide.outputs.should_run_training }}
      should_run_deployment: ${{ steps.decide.outputs.should_run_deployment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Parse configuration
        id: parse
        run: |
          # Read config file
          DATA_FREQ=$(grep -A 2 "data_collection:" $CONFIG_FILE | grep "frequency:" | awk '{print $2}' | tr -d '"')
          FEATURE_FREQ=$(grep -A 2 "feature_extraction:" $CONFIG_FILE | grep "frequency:" | awk '{print $2}' | tr -d '"')
          TRAINING_FREQ=$(grep -A 2 "model_training:" $CONFIG_FILE | grep "frequency:" | awk '{print $2}' | tr -d '"')
          DEPLOY_FREQ=$(grep -A 2 "deployment:" $CONFIG_FILE | grep "frequency:" | awk '{print $2}' | tr -d '"')
          NUM_URLS=$(grep "num_urls:" $CONFIG_FILE | head -1 | awk '{print $2}')
          MODE=$(grep "mode:" $CONFIG_FILE | awk '{print $2}' | tr -d '"')

          echo "data_collection_freq=$DATA_FREQ" >> $GITHUB_OUTPUT
          echo "feature_extraction_freq=$FEATURE_FREQ" >> $GITHUB_OUTPUT
          echo "model_training_freq=$TRAINING_FREQ" >> $GITHUB_OUTPUT
          echo "deployment_freq=$DEPLOY_FREQ" >> $GITHUB_OUTPUT
          echo "num_urls=${NUM_URLS}" >> $GITHUB_OUTPUT
          echo "mode=$MODE" >> $GITHUB_OUTPUT

          echo "📋 Configuration loaded:"
          echo "  Mode: $MODE"
          echo "  Data collection: $DATA_FREQ"
          echo "  Feature extraction: $FEATURE_FREQ"
          echo "  Model training: $TRAINING_FREQ"
          echo "  Deployment: $DEPLOY_FREQ"
          echo "  URLs per run: $NUM_URLS"

      - name: Decide what to run
        id: decide
        run: |
          # Determine if today is Sunday (for weekly runs)
          IS_SUNDAY=$(date +%u)  # 7 = Sunday

          # Override from manual trigger
          OVERRIDE="${{ github.event.inputs.override_stage }}"

          # Data collection decision
          DATA_FREQ="${{ steps.parse.outputs.data_collection_freq }}"
          if [ "$OVERRIDE" = "all" ] || [ "$OVERRIDE" = "data" ]; then
            SHOULD_RUN_DATA=true
          elif [ "$DATA_FREQ" = "daily" ] || [ "$DATA_FREQ" = "twice_daily" ]; then
            SHOULD_RUN_DATA=true
          elif [ "$DATA_FREQ" = "weekly" ] && [ "$IS_SUNDAY" = "7" ]; then
            SHOULD_RUN_DATA=true
          else
            SHOULD_RUN_DATA=false
          fi

          # Training decision
          TRAINING_FREQ="${{ steps.parse.outputs.model_training_freq }}"
          if [ "$OVERRIDE" = "all" ] || [ "$OVERRIDE" = "training" ]; then
            SHOULD_RUN_TRAINING=true
          elif [ "$TRAINING_FREQ" = "daily" ]; then
            SHOULD_RUN_TRAINING=true
          elif [ "$TRAINING_FREQ" = "weekly" ] && [ "$IS_SUNDAY" = "7" ]; then
            SHOULD_RUN_TRAINING=true
          else
            SHOULD_RUN_TRAINING=false
          fi

          # Deployment decision (usually same as training)
          DEPLOY_FREQ="${{ steps.parse.outputs.deployment_freq }}"
          if [ "$OVERRIDE" = "all" ] || [ "$OVERRIDE" = "deploy" ]; then
            SHOULD_RUN_DEPLOYMENT=true
          elif [ "$DEPLOY_FREQ" = "daily" ]; then
            SHOULD_RUN_DEPLOYMENT=true
          elif [ "$DEPLOY_FREQ" = "weekly" ] && [ "$IS_SUNDAY" = "7" ]; then
            SHOULD_RUN_DEPLOYMENT=true
          else
            SHOULD_RUN_DEPLOYMENT=false
          fi

          echo "should_run_data=$SHOULD_RUN_DATA" >> $GITHUB_OUTPUT
          echo "should_run_training=$SHOULD_RUN_TRAINING" >> $GITHUB_OUTPUT
          echo "should_run_deployment=$SHOULD_RUN_DEPLOYMENT" >> $GITHUB_OUTPUT

          echo "🎯 Run decisions:"
          echo "  Data collection: $SHOULD_RUN_DATA"
          echo "  Model training: $SHOULD_RUN_TRAINING"
          echo "  Deployment: $SHOULD_RUN_DEPLOYMENT"

  # ========================================================================
  # JOB 2: Data Collection & Feature Extraction (AWS)
  # ========================================================================
  data-and-features:
    name: Collect Data & Extract Features
    runs-on: ubuntu-latest
    needs: load-config
    if: needs.load-config.outputs.should_run_data == 'true'
    timeout-minutes: 350  # 5h50m — under the 6h GH Actions hard cap, headroom for a 3K-URL EC2 extraction (~5h) plus fetch/setup overhead

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt boto3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set batch info
        id: batch
        run: |
          # Include time so the morning and evening runs get DISTINCT batch ids.
          # Previously both used date-only, so they collided on the same S3 batch
          # file and the same EC2 checkpoint — the evening run resumed from the
          # morning's "completed" checkpoint and re-uploaded stale DNS/WHOIS data,
          # freezing those masters (+0 new every run).
          BATCH_DATE=$(date +%Y%m%d_%H%M%S)
          BATCH_NAME="batch_${BATCH_DATE}.csv"
          BATCH_FILE="data/url_queue/${BATCH_NAME}"

          echo "batch_date=$BATCH_DATE" >> $GITHUB_ENV
          echo "batch_name=$BATCH_NAME" >> $GITHUB_ENV
          echo "batch_file=$BATCH_FILE" >> $GITHUB_ENV

      - name: Whitelist this runner in RDS SG (for balance check)
        uses: ./.github/actions/rds-access
        with:
          db_instance_id: phishnet-db
          aws_region: ${{ env.AWS_REGION }}

      - name: Export URL master from Postgres for balance check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mkdir -p data/processed
          # fetch_urls.py reads phishing_features_complete.csv to compute
          # class balance and to skip URLs already in the master. Since the
          # daemon no longer writes CSV masters to S3, dump url_features
          # from Postgres to the same path. Streaming — constant memory
          # regardless of table size.
          pip install psycopg2-binary >/dev/null 2>&1
          python - <<'PY'
          import csv, os, psycopg2
          conn = psycopg2.connect(os.environ["DATABASE_URL"], connect_timeout=15)
          out = "data/processed/phishing_features_complete.csv"
          with conn.cursor(name="balance_export") as cur:
              cur.itersize = 10_000
              # Only the columns fetch_urls.py needs (url + label). Full
              # export would be wasteful — this is called on every twice-
              # daily pipeline run.
              cur.execute("SELECT url, label FROM url_features")
              with open(out, "w", encoding="utf-8", newline="") as f:
                  w = csv.writer(f)
                  w.writerow(["url", "label"])
                  n = 0
                  for row in cur:
                      w.writerow(row)
                      n += 1
                  print(f"Exported {n} rows to {out}")
          conn.close()
          PY

      - name: Revoke RDS access (balance check)
        if: always() && env.RDS_TMP_SG_ID != ''
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$RDS_TMP_SG_ID" \
            --protocol tcp --port 5432 \
            --cidr "$RDS_TMP_RUNNER_IP/32" \
            --region "$RDS_TMP_AWS_REGION" \
            2>&1 | grep -v "does not exist" || true

      - name: Collect URLs
        run: |
          NUM_URLS="${{ github.event.inputs.num_urls || needs.load-config.outputs.num_urls }}"
          echo "Collecting $NUM_URLS URLs..."
          python3 scripts/fetch_urls.py ${{ env.batch_file }} $NUM_URLS

      - name: Check data quality
        run: |
          echo "=============================================="
          echo "DATA QUALITY CHECK"
          echo "=============================================="

          python3 << 'EOF'
          import pandas as pd
          import json
          import os

          df = pd.read_csv('${{ env.batch_file }}')
          total = len(df)

          if 'label' in df.columns:
              if df['label'].dtype == 'object':
                  phishing = (df['label'].str.lower() == 'phishing').sum()
              else:
                  phishing = (df['label'] == 1).sum()
              legit = total - phishing
              ratio = phishing / max(total, 1)

              print(f"Batch: {phishing} phishing + {legit} legitimate = {total} total")
              print(f"Phishing ratio: {ratio*100:.1f}%")

              if ratio > 0.70:
                  print(f"⚠️  WARNING: Batch is {ratio*100:.0f}% phishing (>70%)")
              elif ratio < 0.30:
                  print(f"⚠️  WARNING: Batch is only {ratio*100:.0f}% phishing (<30%)")
              else:
                  print(f"✅ Batch balance OK")

          # Upload collection log to S3 for persistence
          log_file = 'data/collection_log.json'
          if os.path.exists(log_file):
              print(f"\nCollection log exists, will upload to S3")
          EOF

          # Upload collection log to S3
          if [ -f "data/collection_log.json" ]; then
            aws s3 cp data/collection_log.json s3://${{ env.S3_BUCKET }}/logs/collection_log.json
          fi

      - name: Extract URL Features
        run: |
          echo "Extracting URL features..."
          python3 scripts/extract_url_features.py ${{ env.batch_file }} data/processed/url_features_${{ env.batch_date }}.csv

      - name: Publish batch to the S3 queue (daemon picks it up)
        run: |
          # Producer/consumer via S3. GitHub Actions is the producer; the
          # phishnet-daemon systemd unit on EC2 is the consumer. No SSH lifeline.
          # Order matters: the READY_ marker MUST be written last so the daemon
          # never sees a marker before both data files exist.
          BD="${{ env.batch_date }}"
          echo "Uploading batch data files first..."
          aws s3 cp "${{ env.batch_file }}" "s3://${{ env.S3_BUCKET }}/queue/${{ env.batch_name }}"
          aws s3 cp "data/processed/url_features_${BD}.csv" "s3://${{ env.S3_BUCKET }}/queue/url_features_${BD}.csv"
          echo "Now writing READY marker so the daemon can pick this batch up..."
          echo "{\"batch_date\": \"${BD}\", \"queued_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > /tmp/ready.json
          aws s3 cp /tmp/ready.json "s3://${{ env.S3_BUCKET }}/queue/READY_${BD}.marker"

      - name: Wake EC2 if it's stopped
        id: ec2
        run: |
          # The daemon shuts EC2 down when idle. Start it if needed; the
          # daemon (systemd) starts on boot and will immediately see the marker.
          STATE=$(aws ec2 describe-instances \
            --instance-ids ${{ env.EC2_INSTANCE_ID }} \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)
          echo "EC2 instance state: $STATE"

          if [ "$STATE" = "stopped" ] || [ "$STATE" = "stopping" ]; then
            # If it's mid-stop, wait for it to reach "stopped" before starting.
            if [ "$STATE" = "stopping" ]; then
              aws ec2 wait instance-stopped --instance-ids ${{ env.EC2_INSTANCE_ID }} || true
            fi
            echo "Starting EC2..."
            aws ec2 start-instances --instance-ids ${{ env.EC2_INSTANCE_ID }}
            aws ec2 wait instance-running --instance-ids ${{ env.EC2_INSTANCE_ID }}
            echo "EC2 running; daemon will start via systemd within seconds."
          else
            echo "EC2 already running."
          fi

      - name: Wait for daemon to finish the batch
        id: wait_daemon
        run: |
          # Poll S3 for the daemon's done.json for this batch. Timeout is
          # a soft ceiling — if it fires, we skip the freshness check
          # (which would give a false negative) and exit successfully.
          # The daemon keeps working; next run's freshness check confirms.
          BD="${{ env.batch_date }}"
          KEY="pipeline_state/${BD}/done.json"
          MAX_WAIT_MIN=340      # 5h 40m — real batches now take 5h-6h,
                                # up from 4-4.5h when we sized this originally
          POLL_SEC=60
          START=$(date +%s)
          while : ; do
            if aws s3api head-object --bucket ${{ env.S3_BUCKET }} --key "$KEY" >/dev/null 2>&1 ; then
              echo "Daemon signaled done for batch ${BD}. Fetching done.json..."
              aws s3 cp "s3://${{ env.S3_BUCKET }}/$KEY" /tmp/done.json
              cat /tmp/done.json
              if grep -q '"ok": true' /tmp/done.json ; then
                echo "✅ Batch reported ok."
                echo "batch_done=true" >> "$GITHUB_OUTPUT"
                exit 0
              else
                echo "❌ Batch reported failure."
                exit 1
              fi
            fi
            NOW=$(date +%s)
            ELAPSED_MIN=$(( (NOW - START) / 60 ))
            if [ "$ELAPSED_MIN" -ge "$MAX_WAIT_MIN" ]; then
              echo "⏱️  Waited ${ELAPSED_MIN} min without a done.json — GH job giving up watch."
              echo "Daemon is still processing on EC2; next run's freshness check will confirm."
              # Signal to later steps that we timed out — they should skip
              # the freshness check (data is legitimately not there yet).
              echo "batch_done=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "  ...still waiting (${ELAPSED_MIN}/${MAX_WAIT_MIN} min). Sleeping ${POLL_SEC}s."
            sleep "$POLL_SEC"
          done

      - name: Whitelist runner in RDS SG (for freshness verify)
        # Skip the freshness check if the daemon watch timed out — the
        # batch is still processing and MAX(updated_at) legitimately
        # hasn't advanced yet. Next scheduled run will verify.
        if: steps.wait_daemon.outputs.batch_done == 'true'
        uses: ./.github/actions/rds-access
        with:
          db_instance_id: phishnet-db
          aws_region: ${{ env.AWS_REGION }}

      - name: Verify Postgres tables were freshly updated
        if: steps.wait_daemon.outputs.batch_done == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Defense-in-depth: even if done.json said ok, verify the daemon's
          # upserts actually landed in Postgres by checking max(updated_at)
          # is recent. Catches silent failure modes (network issue between
          # done marker write and DB commit, etc).
          #
          # NOTE: the S3 CSV masters check that used to live here is gone.
          # The daemon no longer writes those files — Postgres is the
          # source of truth. Old S3 masters are stale by design.
          pip install psycopg2-binary >/dev/null 2>&1
          python - <<'PY'
          import os, sys, psycopg2
          from datetime import datetime, timezone

          THRESHOLD_MIN = 360
          conn = psycopg2.connect(os.environ["DATABASE_URL"], connect_timeout=15)
          bad = []
          with conn.cursor() as cur:
              for table in ("url_features", "dns_features", "whois_features"):
                  cur.execute(f"SELECT MAX(updated_at) FROM {table}")
                  (last,) = cur.fetchone()
                  if last is None:
                      bad.append(f"{table}: no rows at all")
                      continue
                  age_min = (datetime.now(timezone.utc) - last).total_seconds() / 60
                  status = "✅" if age_min <= THRESHOLD_MIN else "❌"
                  print(f"  {status} {table}: max(updated_at) = {age_min:.1f} min ago")
                  if age_min > THRESHOLD_MIN:
                      bad.append(f"{table}: {age_min:.0f} min stale (> {THRESHOLD_MIN} threshold)")
          conn.close()
          if bad:
              print("❌ Postgres freshness check failed:")
              for b in bad:
                  print(f"    - {b}")
              sys.exit(1)
          print("✅ All Postgres tables updated within threshold.")
          PY

      - name: Revoke RDS access (freshness verify)
        if: always() && env.RDS_TMP_SG_ID != ''
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$RDS_TMP_SG_ID" \
            --protocol tcp --port 5432 \
            --cidr "$RDS_TMP_RUNNER_IP/32" \
            --region "$RDS_TMP_AWS_REGION" \
            2>&1 | grep -v "does not exist" || true

      # Note: we no longer stop EC2 here. The daemon does that itself after
      # IDLE_SHUTDOWN_MIN minutes of empty queue. This means EC2 stays up
      # briefly across back-to-back runs, which is cheaper than repeated
      # boot cycles.

      # data-and-features used to publish an S3 CSV artifact for
      # train-models to consume. That dependency was removed when we
      # parallelized the two jobs, and now train-models exports directly
      # from Postgres — no artifact needed.

  # ========================================================================
  # JOB 3: Model Training
  # ========================================================================
  train-models:
    name: Train ML Models
    runs-on: ubuntu-latest
    # Parallel with data-and-features, NOT after it. Training uses whatever
    # is in s3://phishnet-data/master/ at job start (previous run's data),
    # so it doesn't need this run's fresh extraction. This turns wall-clock
    # from (extraction ~5h) + (training ~10m) into max of the two — new
    # models get deployed early in each scheduled slot instead of after
    # extraction finishes.
    needs: [load-config]
    if: needs.load-config.outputs.should_run_training == 'true'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt boto3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Whitelist this runner in RDS SG
        uses: ./.github/actions/rds-access
        with:
          db_instance_id: phishnet-db
          aws_region: ${{ env.AWS_REGION }}

      - name: Export joined master from Postgres
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Postgres 'phishing_features' view is url_features LEFT JOIN
          # dns_features LEFT JOIN whois_features on url. Streams straight
          # into the same CSV path downstream steps already read.
          pip install psycopg2-binary >/dev/null 2>&1
          mkdir -p data/processed
          python - <<'PY'
          import csv, os, psycopg2
          conn = psycopg2.connect(os.environ["DATABASE_URL"], connect_timeout=15)
          out = "data/processed/phishing_features_complete.csv"

          # Get column names via a regular (client-side) cursor. On named
          # cursors, .description is None until the first fetch, so a
          # naive [d[0] for d in cur.description] blows up with TypeError.
          with conn.cursor() as cur:
              cur.execute(
                  "SELECT column_name FROM information_schema.columns "
                  "WHERE table_name = 'phishing_features' ORDER BY ordinal_position"
              )
              colnames = [r[0] for r in cur.fetchall()]

          # Then stream the actual rows via a server-side cursor.
          with conn.cursor(name="training_export") as cur:
              cur.itersize = 10_000
              cur.execute(f"SELECT {', '.join(colnames)} FROM phishing_features")
              with open(out, "w", encoding="utf-8", newline="") as f:
                  w = csv.writer(f)
                  w.writerow(colnames)
                  n = 0
                  for row in cur:
                      w.writerow("" if v is None else v for v in row)
                      n += 1
                  print(f"Exported {n} rows × {len(colnames)} columns to {out}")
          conn.close()
          PY

      - name: Revoke RDS access
        if: always() && env.RDS_TMP_SG_ID != ''
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$RDS_TMP_SG_ID" \
            --protocol tcp --port 5432 \
            --cidr "$RDS_TMP_RUNNER_IP/32" \
            --region "$RDS_TMP_AWS_REGION" \
            2>&1 | grep -v "does not exist" || true

      - name: Apply user feedback corrections
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "Checking for user feedback corrections..."
          pip install psycopg2-binary

          # Export corrections from PostgreSQL (if available)
          python3 scripts/export_feedback_corrections.py \
            --output data/feedback/corrections.csv \
            --days 30 \
            --min-corrections 5 \
            --no-s3 || echo "No corrections to export"

          # Merge corrections into training data (if corrections exist)
          if [ -f "data/feedback/corrections.csv" ]; then
            python3 scripts/merge_feedback_for_training.py \
              --corrections data/feedback/corrections.csv \
              --master data/processed/phishing_features_complete.csv \
              --no-download \
              --no-upload || echo "No corrections to merge"
          fi

      - name: Prepare model-ready datasets
        run: |
          # Encode labels and create imputed version
          python3 << 'EOF'
          import pandas as pd
          import numpy as np

          df = pd.read_csv('data/processed/phishing_features_complete.csv')
          print(f"📊 Loaded {len(df)} rows from S3")

          # Normalize labels - handle mixed string/numeric formats
          if 'label' in df.columns:
              # Convert to string first for consistent mapping
              df['label'] = df['label'].astype(str).str.strip().str.lower()

              # Map all variations to 0/1
              label_map = {
                  'phishing': 1, '1': 1, '1.0': 1,
                  'legitimate': 0, '0': 0, '0.0': 0
              }
              df['label'] = df['label'].map(label_map)

              # Drop any rows that couldn't be mapped
              before = len(df)
              df = df.dropna(subset=['label'])
              dropped = before - len(df)
              if dropped > 0:
                  print(f"⚠️  Dropped {dropped} rows with invalid labels")

              df['label'] = df['label'].astype(int)

          df.to_csv('data/processed/phishing_features_complete.csv', index=False)

          # Create imputed version
          df_imputed = df.copy()
          non_feature_cols = ['url', 'label', 'source', 'bucket']
          feature_cols = [col for col in df_imputed.columns if col not in non_feature_cols]

          for col in feature_cols:
              if df_imputed[col].dtype in ['float64', 'int64']:
                  df_imputed[col].fillna(df_imputed[col].mean(), inplace=True)
          df_imputed.fillna(0, inplace=True)
          df_imputed.to_csv('data/processed/phishing_features_complete_imputed.csv', index=False)

          print(f"✅ Prepared {len(df)} rows for training")
          print(f"   Label distribution: {df['label'].value_counts().to_dict()}")
          EOF

          # Copy to modelready files
          cp data/processed/phishing_features_complete.csv data/processed/url_features_modelready.csv
          cp data/processed/phishing_features_complete.csv data/processed/dns_features_modelready.csv
          cp data/processed/phishing_features_complete.csv data/processed/whois_features_modelready.csv
          cp data/processed/phishing_features_complete_imputed.csv data/processed/url_features_modelready_imputed.csv
          cp data/processed/phishing_features_complete_imputed.csv data/processed/dns_features_modelready_imputed.csv
          cp data/processed/phishing_features_complete_imputed.csv data/processed/whois_features_modelready_imputed.csv

      - name: Train URL model
        run: python3 scripts/train_url_model.py

      - name: Train DNS model
        run: python3 scripts/train_dns_model.py

      - name: Train WHOIS model
        run: python3 scripts/train_whois_model.py

      - name: Sync .pkl models to S3
        run: |
          # Model .pkl files can exceed GitHub's 100 MB per-file limit
          # (dns_rf.pkl was 109 MB on 2026-07-19 and killed the pipeline).
          # Blobs live in S3; only small metadata JSON is tracked in git.
          if [ -d models ] && [ -n "$(ls -A models/ 2>/dev/null)" ]; then
            aws s3 sync models/ s3://${{ env.S3_BUCKET }}/models/ \
              --exclude "*" --include "*.pkl" --include "*.json"
            echo "✅ Synced models/ to s3://${{ env.S3_BUCKET }}/models/"
          else
            echo "No models/ dir or empty — skipping sync"
          fi

      - name: Commit metadata JSON only
        run: |
          git config user.name "EpbAiD"
          git config user.email "eeshanpbhanap@gmail.com"

          # Only stage the small metadata files that belong in git. Do NOT
          # `git add models/` — that stages every .pkl, and >100 MB blobs
          # get rejected by GitHub's push size limit.
          META_TARGETS=()
          for f in models/production_metadata.json models/deployed_metadata.json; do
            if [ -f "$f" ]; then
              cp "$f" ".github/$(basename $f)"
              META_TARGETS+=(".github/$(basename $f)")
            fi
          done
          if [ ${#META_TARGETS[@]} -eq 0 ]; then
            echo "No metadata files to commit"
            exit 0
          fi
          git add "${META_TARGETS[@]}"

          if git diff --staged --quiet; then
            echo "No metadata changes to commit"
            exit 0
          fi

          MODE="${{ needs.load-config.outputs.mode }}"
          ROWS=$(wc -l < data/processed/phishing_features_complete.csv)
          git commit -m "[$MODE] Train models on $ROWS URLs" || echo "Nothing to commit"
          # Don't fail the whole job if the push has trouble — daily_retrain
          # writes the same metadata daily, so a missed commit is not fatal.
          git push origin main || echo "Push failed — will retry next run"

  # ========================================================================
  # JOB 4: Update Validation Counter
  # ========================================================================
  update-validation:
    name: Update Validation Progress
    runs-on: ubuntu-latest
    needs: [load-config, train-models]
    if: needs.load-config.outputs.mode == 'validation'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Increment validation counter
        run: |
          COMPLETED=$(grep "runs_completed:" .github/pipeline_config.yml | awk '{print $2}')
          NEW_COUNT=$((COMPLETED + 1))

          sed -i "s/runs_completed: $COMPLETED/runs_completed: $NEW_COUNT/" .github/pipeline_config.yml

          git config user.name "EpbAiD"
          git config user.email "eeshanpbhanap@gmail.com"
          git add .github/pipeline_config.yml
          git commit -m "Validation progress: Run $NEW_COUNT of 10 complete"

          # Pull first to avoid conflicts with model training job
          git pull --rebase origin main
          git push

          echo "✅ Validation run $NEW_COUNT of 10 complete"

          if [ $NEW_COUNT -eq 10 ]; then
            echo "🎉 ALL 10 VALIDATION RUNS COMPLETE!"
            echo "💡 Change frequencies in .github/pipeline_config.yml to production mode"
          fi
