name: Fetch daemon logs

# Read-only. SSHes into the EC2 instance, captures the daemon journal
# (which contains phishing URL strings that some antivirus/paste-scanners
# false-positive on when pasted anywhere), uploads the full log as an
# S3 object under logs/, prints only a summary to the workflow console,
# and disconnects.
#
# The full log lands at:
#   s3://phishnet-data/logs/daemon-<batch-timestamp>-<runid>.txt
# and also gets attached as a GitHub Actions artifact for local download.
#
# HOW TO RUN:
#   Actions tab → "Fetch daemon logs" → Run workflow.
#   Optional input: how many journal lines to fetch (default 300).
#
# COST:
#   ~10 seconds of a t3.micro + one S3 PUT. Effectively $0.

on:
  workflow_dispatch:
    inputs:
      lines:
        description: 'How many journal lines to fetch'
        required: false
        default: '300'
        type: string

env:
  AWS_REGION: us-east-1
  S3_BUCKET: phishnet-data
  EC2_INSTANCE_ID: i-0340d8051273ce3d5

jobs:
  fetch:
    name: Fetch daemon logs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Start EC2 if stopped
        id: ec2
        run: |
          STATE=$(aws ec2 describe-instances \
            --instance-ids ${{ env.EC2_INSTANCE_ID }} \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)
          echo "State: $STATE"
          if [ "$STATE" = "stopped" ] || [ "$STATE" = "stopping" ]; then
            if [ "$STATE" = "stopping" ]; then
              aws ec2 wait instance-stopped --instance-ids ${{ env.EC2_INSTANCE_ID }} || true
            fi
            aws ec2 start-instances --instance-ids ${{ env.EC2_INSTANCE_ID }}
            aws ec2 wait instance-running --instance-ids ${{ env.EC2_INSTANCE_ID }}
            sleep 45  # let SSH come up
          fi
          IP=$(aws ec2 describe-instances \
            --instance-ids ${{ env.EC2_INSTANCE_ID }} \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "IP: $IP"
          echo "ec2_ip=$IP" >> $GITHUB_OUTPUT

      - name: Build the full log bundle on EC2 into /tmp/daemon-log.txt
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.ec2.outputs.ec2_ip }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          command_timeout: 3m
          script: |
            # Write the bundle to a file locally, then upload to S3 in the
            # next step of the workflow (the runner has AWS creds, EC2 does
            # too via env, but keeping the upload on the runner is simplest).
            OUT=/tmp/daemon-log.txt
            {
              echo "===== systemctl status phishnet-daemon ====="
              sudo systemctl status phishnet-daemon --no-pager || true
              echo ""
              echo "===== last ${{ github.event.inputs.lines }} journal lines ====="
              sudo journalctl -u phishnet-daemon -n ${{ github.event.inputs.lines }} --no-pager || true
              echo ""
              echo "===== active daemon processes ====="
              ps -ef | grep -E "phishnet|ec2_daemon" | grep -v grep || echo "  (no phishnet processes running)"
              echo ""
              echo "===== disk usage ====="
              df -h / | tail -1
              echo ""
              echo "===== recent /tmp entries (phishnet extraction scratch dirs) ====="
              ls -la /tmp/phishnet-extract-* 2>/dev/null || echo "  (no /tmp/phishnet-extract-* — cleanup ran)"
              echo ""
              echo "===== Recent kernel messages (OOM kills, if any) ====="
              sudo dmesg -T 2>/dev/null | tail -50 || true
            } > "$OUT" 2>&1

            echo "Bundle built:"
            wc -l "$OUT"
            ls -la "$OUT"

      - name: SCP daemon log back to runner
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.ec2.outputs.ec2_ip }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          command_timeout: 3m
          source: /tmp/daemon-log.txt
          target: ./daemon-log-artifact/

      - name: Upload log to S3 for offline inspection
        run: |
          # File pulled back from EC2 via SCP lands here.
          LOCAL=./daemon-log-artifact/tmp/daemon-log.txt
          if [ ! -f "$LOCAL" ]; then
            echo "❌ Expected $LOCAL not found after SCP — SCP may have failed."
            ls -la ./daemon-log-artifact/ 2>/dev/null || true
            exit 1
          fi
          STAMP=$(date -u +%Y%m%d_%H%M%S)
          S3KEY="logs/daemon-${STAMP}-run${{ github.run_id }}.txt"
          aws s3 cp "$LOCAL" "s3://${{ env.S3_BUCKET }}/${S3KEY}"
          echo ""
          echo "Full log uploaded to:"
          echo "  s3://${{ env.S3_BUCKET }}/${S3KEY}"
          echo "It will be readable directly from the AWS CLI or Claude assistant."

      - name: Print short summary to the workflow console
        run: |
          # Show only head + tail so the console is useful, but avoid pasting
          # phishing-URL strings (which trip some Mac paste scanners).
          LOCAL=./daemon-log-artifact/tmp/daemon-log.txt
          echo "===== FIRST 40 LINES ====="
          head -40 "$LOCAL" || true
          echo ""
          echo "===== LAST 60 LINES ====="
          tail -60 "$LOCAL" || true
          echo ""
          echo "===== NOTES ====="
          echo "Full log (~$(wc -l < "$LOCAL") lines) is in the S3 object printed above"
          echo "and also attached as an artifact on this workflow run."

      - name: Attach log as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daemon-log
          path: ./daemon-log-artifact/tmp/daemon-log.txt
          if-no-files-found: warn
          retention-days: 7
