name: Fetch daemon logs

# Read-only. SSHes into the EC2 instance, captures the daemon journal
# (which contains phishing URL strings that some antivirus/paste-scanners
# false-positive on when pasted anywhere), uploads the full log as an
# S3 object under logs/, prints only a summary to the workflow console,
# and disconnects.
#
# The full log lands at:
#   s3://phishnet-data/logs/daemon-<batch-timestamp>-<runid>.txt
# and also gets attached as a GitHub Actions artifact for local download.
#
# HOW TO RUN:
#   Actions tab → "Fetch daemon logs" → Run workflow.
#   Optional input: how many journal lines to fetch (default 300).
#
# COST:
#   ~10 seconds of a t3.micro + one S3 PUT. Effectively $0.

on:
  workflow_dispatch:
    inputs:
      lines:
        description: 'How many journal lines to fetch'
        required: false
        default: '300'
        type: string

env:
  AWS_REGION: us-east-1
  S3_BUCKET: phishnet-data
  EC2_INSTANCE_ID: i-0340d8051273ce3d5

jobs:
  fetch:
    name: Fetch daemon logs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Start EC2 if stopped
        id: ec2
        run: |
          STATE=$(aws ec2 describe-instances \
            --instance-ids ${{ env.EC2_INSTANCE_ID }} \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)
          echo "State: $STATE"
          if [ "$STATE" = "stopped" ] || [ "$STATE" = "stopping" ]; then
            if [ "$STATE" = "stopping" ]; then
              aws ec2 wait instance-stopped --instance-ids ${{ env.EC2_INSTANCE_ID }} || true
            fi
            aws ec2 start-instances --instance-ids ${{ env.EC2_INSTANCE_ID }}
            aws ec2 wait instance-running --instance-ids ${{ env.EC2_INSTANCE_ID }}
            sleep 45  # let SSH come up
          fi
          IP=$(aws ec2 describe-instances \
            --instance-ids ${{ env.EC2_INSTANCE_ID }} \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "IP: $IP"
          echo "ec2_ip=$IP" >> $GITHUB_OUTPUT

      - name: Build the log on EC2 and upload it to S3 directly
        id: bundle
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.ec2.outputs.ec2_ip }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          # Pass the S3 key we want to write to. Two secrets are also passed
          # because /etc/phishnet.env exists for the daemon but we don't want
          # to depend on its contents here — safer to give ec2-user its own
          # creds for this one-shot upload.
          envs: TARGET_KEY,LINES_TO_FETCH,AWS_KEY,AWS_SECRET
        env:
          TARGET_KEY: logs/daemon-${{ github.run_id }}.txt
          LINES_TO_FETCH: ${{ github.event.inputs.lines }}
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          script: |
            # No `set -e` — every section should try to run even if one fails,
            # so we get the maximum amount of useful info even on a bad day.

            OUT=/tmp/daemon-log.txt
            {
              echo "===== systemctl status phishnet-daemon ====="
              sudo systemctl status phishnet-daemon --no-pager 2>&1 || true
              echo ""
              echo "===== last ${LINES_TO_FETCH} journal lines ====="
              sudo journalctl -u phishnet-daemon -n "${LINES_TO_FETCH}" --no-pager 2>&1 || true
              echo ""
              echo "===== active daemon processes ====="
              ps -ef | grep -E "phishnet|ec2_daemon" | grep -v grep || echo "  (no phishnet processes running)"
              echo ""
              echo "===== disk usage ====="
              df -h / 2>&1 | tail -1
              echo ""
              echo "===== /tmp phishnet-extract scratch dirs ====="
              ls -la /tmp/phishnet-extract-* 2>/dev/null || echo "  (no /tmp/phishnet-extract-* — cleanup ran)"
              echo ""
              echo "===== recent kernel messages (OOM kills etc) ====="
              sudo dmesg -T 2>/dev/null | tail -50 || true
            } > "$OUT" 2>&1

            LINE_COUNT=$(wc -l < "$OUT")
            BYTE_COUNT=$(wc -c < "$OUT")
            echo "Bundle built: $LINE_COUNT lines / $BYTE_COUNT bytes"

            # Upload to S3 using the venv's boto3-provided aws CLI, or the
            # system-installed aws CLI if available. AL2023 ships aws CLI v2.
            if ! command -v aws >/dev/null 2>&1; then
              echo "❌ aws CLI not found on EC2 — cannot upload."
              exit 1
            fi

            # Use the per-invocation creds we passed in via envs. This avoids
            # relying on the daemon's /etc/phishnet.env being readable to us.
            export AWS_ACCESS_KEY_ID="$AWS_KEY"
            export AWS_SECRET_ACCESS_KEY="$AWS_SECRET"
            export AWS_DEFAULT_REGION=us-east-1

            aws s3 cp "$OUT" "s3://phishnet-data/${TARGET_KEY}" \
              && echo "Uploaded to s3://phishnet-data/${TARGET_KEY}" \
              || { echo "❌ S3 upload failed"; exit 1; }

      - name: Print S3 URL + short summary
        run: |
          S3KEY="logs/daemon-${{ github.run_id }}.txt"
          S3URI="s3://${{ env.S3_BUCKET }}/${S3KEY}"
          echo "===== Full log uploaded ====="
          echo "  $S3URI"
          echo ""
          echo "The full log contains phishing-URL strings that some paste"
          echo "scanners false-positive on. Fetch via AWS CLI on your own"
          echo "machine, or just tell me the run finished — I read S3 directly."
          echo ""
          echo "===== FIRST 40 LINES (from S3) ====="
          aws s3 cp "$S3URI" - 2>/dev/null | head -40 || echo "(could not fetch preview)"
          echo ""
          echo "===== LAST 60 LINES (from S3) ====="
          aws s3 cp "$S3URI" - 2>/dev/null | tail -60 || echo "(could not fetch preview)"
