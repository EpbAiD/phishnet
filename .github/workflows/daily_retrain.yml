name: Daily Model Retraining

# Trains models daily from continuously accumulated S3 data
# EC2 daemon collects URLs 24/7, this workflow trains on the growing dataset

on:
  schedule:
    - cron: '0 14 * * *'  # Daily at 9 AM EST (14:00 UTC)
  workflow_dispatch:
    inputs:
      force_train:
        description: 'Force training even if diversity check fails'
        required: false
        default: 'false'
        type: boolean

env:
  AWS_REGION: us-east-1
  S3_BUCKET: phishnet-data

jobs:
  daily-retrain:
    name: "Daily Model Retraining"
    runs-on: ubuntu-latest
    timeout-minutes: 180

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt boto3 pyarrow

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download master datasets from S3
        run: |
          echo "=============================================="
          echo "DOWNLOADING MASTER DATASETS FROM S3"
          echo "=============================================="

          mkdir -p data/processed

          # Download all three master datasets
          aws s3 cp s3://${{ env.S3_BUCKET }}/master/url_features_master.csv \
            data/processed/url_features_master.csv 2>/dev/null || echo "No URL master found"

          aws s3 cp s3://${{ env.S3_BUCKET }}/master/dns_features_master.csv \
            data/processed/dns_features_master.csv 2>/dev/null || echo "No DNS master found"

          aws s3 cp s3://${{ env.S3_BUCKET }}/master/whois_features_master.csv \
            data/processed/whois_features_master.csv 2>/dev/null || echo "No WHOIS master found"

          # Download previous production metadata for AUC comparison
          aws s3 cp s3://${{ env.S3_BUCKET }}/models/production_metadata.json \
            data/processed/previous_production_metadata.json 2>/dev/null || echo "No previous metadata"

          # Show dataset sizes
          echo ""
          echo "Dataset sizes:"
          for f in data/processed/*_master.csv; do
            if [ -f "$f" ]; then
              rows=$(wc -l < "$f" | tr -d ' ')
              echo "  $(basename $f): $rows rows"
            fi
          done

      - name: Check data diversity
        id: diversity
        run: |
          echo "=============================================="
          echo "CHECKING DATA DIVERSITY"
          echo "=============================================="

          python3 << 'EOF'
          import pandas as pd
          import sys

          # Simple diversity check
          scores = {}

          for feature_type in ['url', 'dns', 'whois']:
              try:
                  df = pd.read_csv(f'data/processed/{feature_type}_features_master.csv')

                  # Calculate basic diversity metrics
                  total_rows = len(df)

                  if 'label' in df.columns:
                      phishing = (df['label'] == 'phishing').sum() if df['label'].dtype == 'object' else (df['label'] == 1).sum()
                      balance = min(phishing, total_rows - phishing) / max(total_rows, 1) * 2 * 100
                  else:
                      balance = 50  # Assume balanced if no label

                  # Simple score based on size and balance
                  size_score = min(total_rows / 5000, 1.0) * 50  # Max 50 points for size
                  balance_score = balance  # Max 100 points for balance (50% = 100)

                  scores[feature_type] = {
                      'total': total_rows,
                      'balance': balance,
                      'score': (size_score + balance_score / 2)
                  }

                  print(f"{feature_type.upper()}: {total_rows} rows, {balance:.1f}% balance, score: {scores[feature_type]['score']:.1f}")

              except Exception as e:
                  print(f"{feature_type.upper()}: Error - {e}")
                  scores[feature_type] = {'total': 0, 'balance': 0, 'score': 0}

          # Overall score
          overall = sum(s['score'] for s in scores.values()) / len(scores) if scores else 0
          print(f"\nOverall diversity score: {overall:.1f}/100")

          # Decision
          min_score = 30  # Minimum score to proceed
          if overall < min_score:
              print(f"\n⚠️ Diversity score below {min_score}, training may not be effective")
              with open('DIVERSITY_LOW', 'w') as f:
                  f.write(str(overall))
          else:
              print(f"\n✅ Diversity score OK, proceeding with training")
          EOF

          if [ -f "DIVERSITY_LOW" ] && [ "${{ github.event.inputs.force_train }}" != "true" ]; then
            echo "diversity_ok=false" >> $GITHUB_OUTPUT
          else
            echo "diversity_ok=true" >> $GITHUB_OUTPUT
          fi

      - name: Prepare model-ready datasets
        if: steps.diversity.outputs.diversity_ok == 'true'
        run: |
          echo "=============================================="
          echo "PREPARING MODEL-READY DATASETS"
          echo "=============================================="

          python3 << 'EOF'
          import pandas as pd
          import numpy as np

          for feature_type in ['url', 'dns', 'whois']:
              print(f"\n--- Processing {feature_type.upper()} ---")

              try:
                  df = pd.read_csv(f'data/processed/{feature_type}_features_master.csv')
              except Exception as e:
                  print(f"  ⚠️ Could not load: {e}")
                  continue

              if len(df) < 10:
                  print(f"  ⚠️ Too few rows ({len(df)}), skipping")
                  continue

              print(f"  Loaded {len(df)} rows")

              # Encode labels
              if 'label' in df.columns:
                  if df['label'].dtype == 'object':
                      df['label_encoded'] = df['label'].apply(lambda x: 1 if str(x).lower() == 'phishing' else 0)
                  else:
                      df['label_encoded'] = df['label']
              else:
                  print(f"  ⚠️ No label column")
                  continue

              # Get feature columns
              exclude = ['url', 'label', 'label_encoded', 'domain', 'collected_at', 'source', 'bucket']
              feature_cols = [c for c in df.columns if c not in exclude]

              # Convert object columns to numeric
              for col in feature_cols:
                  if df[col].dtype == 'object':
                      df[col] = df[col].fillna('MISSING')
                      df[col], _ = pd.factorize(df[col])

              # Balance classes by downsampling majority class
              df_phishing = df[df['label_encoded'] == 1]
              df_legit = df[df['label_encoded'] == 0]
              print(f"  Before balancing: {len(df_phishing)} phishing, {len(df_legit)} legitimate")

              minority_size = min(len(df_phishing), len(df_legit))
              if minority_size == 0:
                  print(f"  ⚠️ Only one class present, skipping")
                  continue

              df_phishing_bal = df_phishing.sample(n=minority_size, random_state=42)
              df_legit_bal = df_legit.sample(n=minority_size, random_state=42)
              df = pd.concat([df_phishing_bal, df_legit_bal]).sample(frac=1, random_state=42).reset_index(drop=True)
              print(f"  After balancing: {minority_size} per class ({minority_size * 2} total)")

              # Save
              df_train = df[feature_cols + ['label_encoded']].copy().fillna(0)
              df_train.to_csv(f'data/processed/{feature_type}_features_modelready_imputed.csv', index=False)

              if 'url' in df.columns:
                  df_test = df[['url'] + feature_cols + ['label_encoded']].copy().fillna(0)
                  df_test = df_test.rename(columns={'label_encoded': 'label'})
                  df_test.to_csv(f'data/processed/{feature_type}_features_modelready.csv', index=False)

              print(f"  ✅ Saved with {len(feature_cols)} features")
          EOF

      - name: Train 45 models (15 per feature type)
        if: steps.diversity.outputs.diversity_ok == 'true'
        run: |
          echo "=============================================="
          echo "TRAINING 45 MODELS WITH 5-FOLD CV"
          echo "=============================================="

          mkdir -p models analysis

          python3 << 'EOF'
          import pandas as pd
          import numpy as np
          from sklearn.model_selection import StratifiedKFold
          from sklearn.metrics import roc_auc_score, accuracy_score, f1_score
          from sklearn.ensemble import RandomForestClassifier, GradientBoostingClassifier, AdaBoostClassifier, ExtraTreesClassifier, BaggingClassifier
          from sklearn.linear_model import LogisticRegression
          from sklearn.tree import DecisionTreeClassifier
          from sklearn.neighbors import KNeighborsClassifier
          from sklearn.naive_bayes import GaussianNB
          from sklearn.svm import SVC
          from sklearn.neural_network import MLPClassifier
          from catboost import CatBoostClassifier
          from lightgbm import LGBMClassifier
          from xgboost import XGBClassifier
          import joblib
          import json
          import copy
          import warnings
          warnings.filterwarnings('ignore')

          models = {
              'random_forest': RandomForestClassifier(n_estimators=100, random_state=42, n_jobs=-1),
              'gradient_boost': GradientBoostingClassifier(n_estimators=100, random_state=42),
              'adaboost': AdaBoostClassifier(n_estimators=100, random_state=42, algorithm='SAMME'),
              'logistic': LogisticRegression(max_iter=1000, random_state=42),
              'decision_tree': DecisionTreeClassifier(random_state=42),
              'knn': KNeighborsClassifier(n_neighbors=5),
              'naive_bayes': GaussianNB(),
              'svm': SVC(probability=True, random_state=42),
              'mlp': MLPClassifier(hidden_layer_sizes=(100,), max_iter=500, random_state=42),
              'catboost': CatBoostClassifier(iterations=100, random_state=42, verbose=0),
              'lightgbm': LGBMClassifier(n_estimators=100, random_state=42, verbose=-1),
              'xgboost': XGBClassifier(n_estimators=100, random_state=42, verbosity=0),
              'extra_trees': ExtraTreesClassifier(n_estimators=100, random_state=42, n_jobs=-1),
              'bagging': BaggingClassifier(n_estimators=50, random_state=42),
              'voting_base': RandomForestClassifier(n_estimators=50, random_state=42),
          }

          skf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)
          all_results = {}

          for feature_type in ['url', 'dns', 'whois']:
              print(f"\n{'='*60}")
              print(f"Training {feature_type.upper()} models")
              print(f"{'='*60}")

              try:
                  df = pd.read_csv(f'data/processed/{feature_type}_features_modelready_imputed.csv')
              except FileNotFoundError:
                  print(f"  Skipping {feature_type} - no data")
                  continue

              X = df.drop('label_encoded', axis=1)
              y = df['label_encoded'].values

              print(f"  {len(X)} samples, {len(X.columns)} features")

              if len(np.unique(y)) < 2:
                  print(f"  Skipping - only one class")
                  continue

              results = []

              for name, model_template in models.items():
                  fold_rocs = []

                  try:
                      for train_idx, val_idx in skf.split(X, y):
                          model = copy.deepcopy(model_template)
                          model.fit(X.iloc[train_idx], y[train_idx])

                          if hasattr(model, 'predict_proba'):
                              probs = model.predict_proba(X.iloc[val_idx])[:, 1]
                          else:
                              scores = model.decision_function(X.iloc[val_idx])
                              probs = (scores - scores.min()) / (scores.max() - scores.min() + 1e-12)

                          fold_rocs.append(roc_auc_score(y[val_idx], probs))

                      mean_roc = np.mean(fold_rocs)
                      results.append({'model': name, 'roc_auc': mean_roc})

                      # Train final model on all data
                      final_model = copy.deepcopy(model_template)
                      final_model.fit(X, y)
                      joblib.dump(final_model, f'models/{feature_type}_{name}.pkl')
                      joblib.dump(list(X.columns), f'models/{feature_type}_{name}_feature_cols.pkl')

                      print(f"    {name}: ROC={mean_roc:.4f}")

                  except Exception as e:
                      print(f"    {name}: FAILED - {e}")

              if results:
                  results_df = pd.DataFrame(results).sort_values('roc_auc', ascending=False)
                  results_df.to_csv(f'analysis/{feature_type}_cv_results.csv', index=False)
                  all_results[feature_type] = results

          print("\n✅ Model training complete!")
          EOF

      - name: Test ensemble combinations
        if: steps.diversity.outputs.diversity_ok == 'true'
        run: |
          echo "=============================================="
          echo "TESTING ENSEMBLE COMBINATIONS"
          echo "=============================================="

          python3 scripts/test_ensemble_combinations.py || echo "Ensemble testing completed with warnings"

      - name: Validate against golden test set
        id: golden_gate
        if: steps.diversity.outputs.diversity_ok == 'true'
        run: |
          echo "=============================================="
          echo "GOLDEN TEST SET VALIDATION"
          echo "=============================================="

          python3 << 'PYEOF'
          import pandas as pd
          import numpy as np
          import joblib
          import json
          import sys
          sys.path.insert(0, '.')

          from src.features.url_features import extract_single_url_features

          # Load golden test set
          golden = pd.read_csv('data/test/golden_test_set.csv')
          print(f"Golden test set: {len(golden)} URLs ({(golden['label']=='legitimate').sum()} safe, {(golden['label']=='phishing').sum()} phishing)")

          # Extract URL features for golden set (URL features are fast, no network calls for DNS/WHOIS)
          print("\nExtracting URL features for golden test set...")
          features_list = []
          for idx, row in golden.iterrows():
              try:
                  feats = extract_single_url_features(row['url'])
                  feats['url'] = row['url']
                  feats['label'] = row['label']
                  features_list.append(feats)
              except Exception as e:
                  print(f"  Failed for {row['url'][:50]}: {e}")
                  features_list.append({'url': row['url'], 'label': row['label']})

          df_golden = pd.DataFrame(features_list)
          golden_labels = df_golden['label'].apply(lambda x: 1 if x == 'phishing' else 0).values

          # Test URL model (primary model for the web app)
          results = {}
          try:
              # Find best URL model from CV results
              cv_results = pd.read_csv('analysis/url_cv_results.csv')
              best_model_name = cv_results.iloc[0]['model']

              model = joblib.load(f'models/url_{best_model_name}.pkl')
              feature_cols = joblib.load(f'models/url_{best_model_name}_feature_cols.pkl')

              # Prepare features
              for col in feature_cols:
                  if col not in df_golden.columns:
                      df_golden[col] = 0

              X_golden = df_golden[feature_cols].fillna(0)

              # Convert object columns to numeric (same as training)
              for col in X_golden.columns:
                  if X_golden[col].dtype == 'object':
                      X_golden[col], _ = pd.factorize(X_golden[col])

              preds = model.predict(X_golden)
              probs = model.predict_proba(X_golden)[:, 1] if hasattr(model, 'predict_proba') else preds

              # Accuracy metrics
              from sklearn.metrics import accuracy_score, roc_auc_score

              overall_acc = accuracy_score(golden_labels, preds)

              # Safe URL accuracy (must NOT be flagged as phishing)
              safe_mask = golden_labels == 0
              safe_preds = preds[safe_mask]
              safe_acc = (safe_preds == 0).mean()  # % of safe URLs correctly identified as safe
              fp_rate = (safe_preds == 1).mean()  # False positive rate on safe URLs

              # Phishing URL accuracy
              phish_mask = golden_labels == 1
              phish_preds = preds[phish_mask]
              phish_acc = (phish_preds == 1).mean()  # % of phishing URLs correctly caught

              try:
                  auc = roc_auc_score(golden_labels, probs)
              except:
                  auc = 0.0

              results = {
                  'model': f'url_{best_model_name}',
                  'overall_accuracy': round(overall_acc, 4),
                  'safe_url_accuracy': round(safe_acc, 4),
                  'false_positive_rate': round(fp_rate, 4),
                  'phishing_detection_rate': round(phish_acc, 4),
                  'auc': round(auc, 4)
              }

              print(f"\n📊 Golden Test Results (url_{best_model_name}):")
              print(f"  Overall accuracy:       {overall_acc*100:.1f}%")
              print(f"  Safe URL accuracy:      {safe_acc*100:.1f}% (must be ≥95%)")
              print(f"  False positive rate:    {fp_rate*100:.1f}% (must be <5%)")
              print(f"  Phishing detection:     {phish_acc*100:.1f}%")
              print(f"  AUC:                    {auc:.4f}")

          except Exception as e:
              print(f"❌ Golden test failed: {e}")
              import traceback
              traceback.print_exc()
              results = {'error': str(e), 'safe_url_accuracy': 0, 'false_positive_rate': 1.0}

          # Save results
          with open('analysis/golden_test_results.json', 'w') as f:
              json.dump(results, f, indent=2)

          # Gate: block deployment if safe URL accuracy < 95% (FP rate > 5%)
          safe_acc = results.get('safe_url_accuracy', 0)
          fp_rate = results.get('false_positive_rate', 1.0)

          if safe_acc < 0.95:
              print(f"\n🚫 GOLDEN GATE FAILED: Safe URL accuracy {safe_acc*100:.1f}% < 95% threshold")
              print(f"   {fp_rate*100:.1f}% of safe URLs would be falsely flagged as phishing")
              with open('GOLDEN_GATE_FAILED', 'w') as f:
                  f.write(f"safe_acc={safe_acc}")
          else:
              print(f"\n✅ GOLDEN GATE PASSED: Safe URL accuracy {safe_acc*100:.1f}% ≥ 95%")
          PYEOF

          if [ -f "GOLDEN_GATE_FAILED" ]; then
            echo "::warning::Golden test gate FAILED - safe URLs being flagged as phishing. Deployment blocked."
            echo "golden_passed=false" >> $GITHUB_OUTPUT
          else
            echo "golden_passed=true" >> $GITHUB_OUTPUT
          fi

      - name: Compare AUC with previous model
        id: auc_gate
        if: steps.diversity.outputs.diversity_ok == 'true'
        run: |
          echo "=============================================="
          echo "MODEL AUC REGRESSION CHECK"
          echo "=============================================="

          python3 << 'PYEOF'
          import json
          import pandas as pd

          # Load previous metadata
          prev_auc = {}
          try:
              with open('data/processed/previous_production_metadata.json') as f:
                  prev = json.load(f)
              ensemble = prev.get('ensemble', {})
              cv_perf = ensemble.get('cv_performance', {})
              prev_auc = {
                  'url': cv_perf.get('url_roc_auc', 0),
                  'dns': cv_perf.get('dns_roc_auc', 0),
                  'whois': cv_perf.get('whois_roc_auc', 0)
              }
              print(f"Previous AUCs: URL={prev_auc['url']:.4f}, DNS={prev_auc['dns']:.4f}, WHOIS={prev_auc['whois']:.4f}")
          except Exception as e:
              print(f"No previous metadata found ({e}), skipping AUC comparison")
              prev_auc = {}

          if not prev_auc:
              print("✅ No previous AUC to compare against, passing gate")
              exit(0)

          # Load current CV results
          regressions = []
          for ft in ['url', 'dns', 'whois']:
              try:
                  cv = pd.read_csv(f'analysis/{ft}_cv_results.csv')
                  current_best = cv.iloc[0]['roc_auc']
                  prev_best = prev_auc.get(ft, 0)
                  diff = current_best - prev_best

                  status = "✅" if diff >= -0.02 else "🚫"
                  print(f"  {ft.upper()}: {prev_best:.4f} → {current_best:.4f} (diff: {diff:+.4f}) {status}")

                  if diff < -0.02:
                      regressions.append(f"{ft}: {diff:+.4f}")
              except Exception as e:
                  print(f"  {ft.upper()}: Could not compare - {e}")

          if regressions:
              print(f"\n🚫 AUC REGRESSION DETECTED: {', '.join(regressions)}")
              print("   Model AUC dropped by more than 2% on one or more feature types")
              with open('AUC_REGRESSION', 'w') as f:
                  f.write(str(regressions))
          else:
              print(f"\n✅ No AUC regression detected (all within 2% tolerance)")
          PYEOF

          if [ -f "AUC_REGRESSION" ]; then
            echo "::warning::AUC regression detected - model performance dropped >2%. Deployment blocked."
            echo "auc_passed=false" >> $GITHUB_OUTPUT
          else
            echo "auc_passed=true" >> $GITHUB_OUTPUT
          fi

      - name: Upload models to S3
        if: >-
          steps.diversity.outputs.diversity_ok == 'true' &&
          steps.golden_gate.outputs.golden_passed == 'true' &&
          steps.auc_gate.outputs.auc_passed != 'false'
        run: |
          echo "=============================================="
          echo "UPLOADING MODELS TO S3 (ALL GATES PASSED)"
          echo "=============================================="

          # Add timestamp and gate results to production metadata
          python3 << 'EOF'
          import json
          import pandas as pd
          from datetime import datetime

          try:
              with open('models/production_metadata.json', 'r') as f:
                  metadata = json.load(f)
          except:
              metadata = {}

          metadata['last_trained'] = datetime.now().isoformat()
          metadata['training_run'] = '${{ github.run_id }}'

          # Add best AUC per feature type for next run's comparison
          for ft in ['url', 'dns', 'whois']:
              try:
                  cv = pd.read_csv(f'analysis/{ft}_cv_results.csv')
                  metadata.setdefault('ensemble', {}).setdefault('cv_performance', {})[f'{ft}_roc_auc'] = float(cv.iloc[0]['roc_auc'])
              except:
                  pass

          # Add golden test results
          try:
              with open('analysis/golden_test_results.json') as f:
                  metadata['golden_test'] = json.load(f)
          except:
              pass

          with open('models/production_metadata.json', 'w') as f:
              json.dump(metadata, f, indent=2)
          EOF

          # Upload all models
          aws s3 sync models/ s3://${{ env.S3_BUCKET }}/models/ \
            --include "*.pkl" \
            --include "*.json"

          echo ""
          echo "Uploaded models:"
          aws s3 ls s3://${{ env.S3_BUCKET }}/models/ | head -20

          echo ""
          echo "Production metadata:"
          cat models/production_metadata.json

      - name: Commit production training record
        if: >-
          steps.diversity.outputs.diversity_ok == 'true' &&
          steps.golden_gate.outputs.golden_passed == 'true' &&
          steps.auc_gate.outputs.auc_passed != 'false'
        run: |
          # Get total training samples from metadata
          TOTAL_URLS=$(python3 -c "
          import json
          with open('models/production_metadata.json') as f:
              m = json.load(f)
          # Sum across all feature types from the master CSVs
          import pandas as pd
          total = 0
          for ft in ['url', 'dns', 'whois']:
              try:
                  df = pd.read_csv(f'data/processed/{ft}_features_master.csv')
                  total = max(total, len(df))
              except: pass
          print(total)
          ")

          echo "Total training URLs: $TOTAL_URLS"

          # Configure git
          git config user.name "EpbAiD"
          git config user.email "eeshanpbhanap@gmail.com"

          # Commit production metadata
          cp models/production_metadata.json .github/production_metadata.json
          git add .github/production_metadata.json
          git commit -m "[production] Train models on ${TOTAL_URLS} URLs" || echo "Nothing to commit"
          git push origin main || echo "Push failed - will retry next run"

      - name: Summary
        if: always()
        run: |
          echo ""
          echo "=============================================="
          echo "DAILY RETRAINING SUMMARY"
          echo "=============================================="
          echo ""
          echo "Timestamp: $(date)"
          echo "Run ID: ${{ github.run_id }}"
          echo ""
          echo "Gate Results:"
          echo "  Diversity check:    ${{ steps.diversity.outputs.diversity_ok || 'skipped' }}"
          echo "  Golden test gate:   ${{ steps.golden_gate.outputs.golden_passed || 'skipped' }}"
          echo "  AUC regression:     ${{ steps.auc_gate.outputs.auc_passed || 'skipped' }}"
          echo ""

          if [ "${{ steps.golden_gate.outputs.golden_passed }}" == "false" ]; then
            echo "🚫 DEPLOYMENT BLOCKED: Golden test gate failed"
            echo "   Safe URLs are being flagged as phishing - model not deployed"
            echo "   Previous production model remains active"
          elif [ "${{ steps.auc_gate.outputs.auc_passed }}" == "false" ]; then
            echo "🚫 DEPLOYMENT BLOCKED: AUC regression detected"
            echo "   Model performance dropped >2% - model not deployed"
            echo "   Previous production model remains active"
          elif [ "${{ steps.diversity.outputs.diversity_ok }}" == "true" ]; then
            echo "✅ All gates passed - models trained and uploaded to S3"
            echo "   The production API will hot-reload new models automatically"
          else
            echo "⚠️ Training skipped due to low diversity score"
            echo "   Set force_train=true to override"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-retrain-${{ github.run_id }}
          path: |
            analysis/
            models/production_metadata.json
