name: Deploy Web Interface & Extension

on:
  push:
    branches:
      - main
    paths:
      - 'web-app/**'
      - 'browser_extension/**'
      - 'docs/**'
      - 'dashboard/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Web Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-app/package-lock.json

      - name: Build React app
        run: |
          cd web-app
          npm install
          npm run build
          cd ..

      - name: Prepare deployment directory
        run: |
          mkdir -p _site

          # Copy React build output
          cp -r web-app/build/* _site/

          # Build the extension zip from the RAW browser_extension folder
          # (so the zip contains only real extension files — not our install
          # page's index.html which CRA already dropped into _site/extension/).
          if [ -d "browser_extension" ]; then
            (cd browser_extension && zip -r "$GITHUB_WORKSPACE/_site/phishnet-extension.zip" .)
            # Then expose the install page + zip under /extension/.
            # The install page (web-app/public/extension/index.html) was copied
            # to _site/extension/index.html by the React build step above.
            # We deliberately do NOT copy the raw extension source files to
            # _site/extension/, so the /extension/ URL renders index.html and
            # only the zip is exposed for download.
            echo "Extension package built at _site/phishnet-extension.zip"
            ls -lh _site/phishnet-extension.zip
          fi

          # Copy docs if exists
          if [ -d "docs" ]; then
            mkdir -p _site/docs
            cp -r docs/* _site/docs/
          fi

          # Static status dashboard — auto-refreshes from the API's /status endpoint
          if [ -d "dashboard" ]; then
            mkdir -p _site/dashboard
            cp -r dashboard/* _site/dashboard/
          fi

          echo "📦 Deployment directory contents:"
          ls -la _site/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Output deployment URL
        run: |
          echo "🚀 Deployed to: ${{ steps.deployment.outputs.page_url }}"
          echo "Extension available at: ${{ steps.deployment.outputs.page_url }}extension/"
