name: One-shot — Install phishnet-daemon on EC2

# WHAT THIS DOES:
#   - Starts the EC2 instance (if stopped).
#   - SSHes in once, drops the systemd unit + sudoers file + code, creates a
#     venv with the deps, enables and starts the daemon.
#   - After it succeeds, the daemon self-manages: starts on boot, polls S3,
#     stops the instance when idle.
#
# WHEN TO RUN:
#   - Once, after this PR merges, to install the daemon on the EC2 instance.
#   - Again if the daemon or systemd unit changes materially. It's idempotent.
#
# HOW TO RUN:
#   Actions tab → "One-shot — Install phishnet-daemon on EC2" → Run workflow.

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  S3_BUCKET: phishnet-data
  EC2_INSTANCE_ID: i-0340d8051273ce3d5

jobs:
  install:
    name: Install daemon on EC2
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Start EC2 if stopped
        id: ec2
        run: |
          STATE=$(aws ec2 describe-instances \
            --instance-ids ${{ env.EC2_INSTANCE_ID }} \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)
          echo "State: $STATE"
          if [ "$STATE" = "stopped" ]; then
            aws ec2 start-instances --instance-ids ${{ env.EC2_INSTANCE_ID }}
            aws ec2 wait instance-running --instance-ids ${{ env.EC2_INSTANCE_ID }}
            sleep 45  # let SSH come up
          fi
          IP=$(aws ec2 describe-instances \
            --instance-ids ${{ env.EC2_INSTANCE_ID }} \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "IP: $IP"
          echo "ec2_ip=$IP" >> $GITHUB_OUTPUT

      - name: Package install payload into a single tarball
        run: |
          # appleboy/scp-action's `source:` doesn't expand ** globs and its
          # multi-line paths are quirky across versions. Simpler and more
          # reliable: tar everything we need locally, SCP one file, untar
          # on EC2. Sidesteps every glob issue.
          mkdir -p _install_payload/scripts _install_payload/src
          cp scripts/ec2_daemon.py                   _install_payload/scripts/
          cp scripts/extract_vm_features_aws.py      _install_payload/scripts/
          cp scripts/db_migrate.py                   _install_payload/scripts/
          cp scripts/db_upsert.py                    _install_payload/scripts/
          cp scripts/db_schema.sql                   _install_payload/scripts/
          cp scripts/phishnet-daemon.service         _install_payload/scripts/
          cp scripts/phishnet-daemon-sudoers         _install_payload/scripts/
          # Slim EC2-only requirements — the full requirements.txt has ML
          # packages (scikit-learn, catboost, ...) that don't install on
          # Python 3.8 which is what the EC2 AMI ships. Extraction doesn't
          # need those anyway.
          cp requirements-ec2.txt                    _install_payload/
          cp -r src/*                                _install_payload/src/
          tar czf install_payload.tar.gz -C _install_payload .
          echo "Payload contents:"
          tar tzf install_payload.tar.gz | head -30
          echo "..."
          echo "Payload size: $(du -h install_payload.tar.gz | cut -f1)"

      - name: SCP payload tarball to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.ec2.outputs.ec2_ip }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          source: install_payload.tar.gz
          target: /home/ec2-user/

      - name: Install and enable systemd service
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_ACCESS_KEY_ID_SECRET: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DATABASE_URL_SECRET: ${{ secrets.DATABASE_URL }}
        with:
          host: ${{ steps.ec2.outputs.ec2_ip }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          envs: AWS_ACCESS_KEY_ID_SECRET,AWS_SECRET_ACCESS_KEY_SECRET,DATABASE_URL_SECRET
          script: |
            set -euo pipefail

            SRC=/home/ec2-user/phishnet-install
            DST=/home/ec2-user/phishnet

            echo "=== Unpack payload tarball ==="
            rm -rf "$SRC"
            mkdir -p "$SRC"
            tar xzf /home/ec2-user/install_payload.tar.gz -C "$SRC"
            rm -f /home/ec2-user/install_payload.tar.gz
            echo "Unpacked payload:"
            ls -la "$SRC"
            ls -la "$SRC/scripts"

            echo "=== Sync source to $DST ==="
            mkdir -p "$DST/scripts" "$DST/src"
            cp "$SRC/scripts/ec2_daemon.py"              "$DST/scripts/"
            cp "$SRC/scripts/extract_vm_features_aws.py" "$DST/scripts/"
            cp "$SRC/scripts/db_migrate.py"              "$DST/scripts/"
            cp "$SRC/scripts/db_upsert.py"               "$DST/scripts/"
            cp "$SRC/scripts/db_schema.sql"              "$DST/scripts/"
            cp -r "$SRC/src/"* "$DST/src/"
            cp "$SRC/requirements-ec2.txt"               "$DST/"

            echo "=== Ensure Python + venv ==="
            # Prefer the newest Python we can find. AL2023 default is 3.9;
            # AL2 was 3.7 with 3.8 as extras. Pick the highest available.
            PY=""
            for cand in python3.12 python3.11 python3.10 python3.9 python3.8 python3; do
              if command -v "$cand" >/dev/null 2>&1; then
                PY="$cand"
                break
              fi
            done
            if [ -z "$PY" ]; then
              echo "❌ No python3 interpreter found. Aborting."
              exit 1
            fi
            echo "Using interpreter: $PY ($($PY --version 2>&1))"
            # Ensure venv module is available (AL2023 default AMI ships it)
            if ! $PY -c 'import venv' >/dev/null 2>&1; then
              echo "❌ Chosen Python ($PY) lacks the venv module. Install python3-devel? Aborting."
              exit 1
            fi
            # Clean the venv so we don't inherit half-installed packages from
            # a prior failed run.
            rm -rf "$DST/.venv"
            $PY -m venv "$DST/.venv"
            "$DST/.venv/bin/pip" install --upgrade pip
            "$DST/.venv/bin/pip" install -r "$DST/requirements-ec2.txt"

            echo "=== Write /etc/phishnet.env (AWS + DB creds + region) ==="
            sudo bash -c "cat > /etc/phishnet.env" <<EOF
            AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID_SECRET
            AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY_SECRET
            AWS_REGION=us-east-1
            S3_BUCKET=phishnet-data
            PHISHNET_POLL_INTERVAL_SEC=60
            PHISHNET_IDLE_SHUTDOWN_MIN=10
            DATABASE_URL=$DATABASE_URL_SECRET
            EOF
            sudo chmod 0640 /etc/phishnet.env
            sudo chown root:root /etc/phishnet.env

            echo "=== Install systemd unit ==="
            sudo cp "$SRC/scripts/phishnet-daemon.service" /etc/systemd/system/
            sudo chmod 0644 /etc/systemd/system/phishnet-daemon.service
            sudo systemctl daemon-reload

            echo "=== Install sudoers rule for self-shutdown ==="
            sudo cp "$SRC/scripts/phishnet-daemon-sudoers" /etc/sudoers.d/phishnet-daemon
            sudo chmod 0440 /etc/sudoers.d/phishnet-daemon
            sudo chown root:root /etc/sudoers.d/phishnet-daemon

            echo "=== Enable + (re)start daemon ==="
            sudo systemctl enable phishnet-daemon
            sudo systemctl restart phishnet-daemon
            sleep 3
            sudo systemctl status phishnet-daemon --no-pager | head -25 || true
            echo ""
            echo "=== Last 20 journal lines ==="
            sudo journalctl -u phishnet-daemon -n 20 --no-pager || true

            echo "=== Cleanup install payload ==="
            rm -rf "$SRC"

      - name: Note
        run: |
          echo "Daemon installed. It will:"
          echo "  - poll s3://${{ env.S3_BUCKET }}/queue/READY_*.marker every 60s"
          echo "  - process each batch (extract features, append to masters)"
          echo "  - after 10 min of empty queue, shutdown -h now"
          echo ""
          echo "To trigger work: run the Unified ML Pipeline; it writes a batch"
          echo "to the queue and starts EC2 if stopped."
