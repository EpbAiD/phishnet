name: Pipeline Health Monitor

# Hourly check that the API is up and the pipeline is fresh.
# Opens (or reuses) a single GitHub issue titled "System health degraded"
# when things go wrong, so you get one clear notification instead of a flood.

on:
  schedule:
    - cron: '15 * * * *'  # every hour at :15
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  API_URL: https://phishnet-api.onrender.com
  ISSUE_TITLE: "System health degraded"

jobs:
  check:
    name: Check /status and open issue if unhealthy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping /status with a generous timeout (Render cold-start)
        id: status
        run: |
          # Give Render up to 90s to wake from sleep before treating as down.
          set -o pipefail
          echo "Fetching ${{ env.API_URL }}/status ..."
          if ! curl -fsSL --max-time 90 "${{ env.API_URL }}/status" -o status.json; then
            echo "api_reachable=false" >> $GITHUB_OUTPUT
            echo "warnings_json=[\"API did not respond within 90s (Render cold-start or actually down).\"]" >> $GITHUB_OUTPUT
            echo "overall=unhealthy" >> $GITHUB_OUTPUT
            # Write a stub body so downstream steps still work.
            echo '{"overall":"unhealthy","warnings":["API did not respond within 90s."]}' > status.json
            exit 0
          fi

          echo "api_reachable=true" >> $GITHUB_OUTPUT
          OVERALL=$(python3 -c "import json; d=json.load(open('status.json')); print(d.get('overall','unknown'))")
          echo "overall=$OVERALL" >> $GITHUB_OUTPUT

          # Prepare a compact warnings list for later inspection
          python3 -c "import json; d=json.load(open('status.json')); print(json.dumps(d.get('warnings', [])))" > warnings.json
          echo "warnings_count=$(python3 -c 'import json; print(len(json.load(open(\"warnings.json\"))))')" >> $GITHUB_OUTPUT

          echo ""
          echo "=== /status response ==="
          cat status.json | python3 -m json.tool | head -80
          echo "========================"

      - name: Compose status report for issue body
        id: report
        run: |
          # Write Python to a file first — a heredoc inline in YAML with strings
          # containing backslashes/quotes has caused SyntaxError before.
          cat > /tmp/make_report.py << 'PY'
          import json
          from datetime import datetime, timezone

          d = json.load(open("status.json"))
          now = datetime.now(timezone.utc).isoformat()

          overall = d.get("overall", "unknown")
          warnings = d.get("warnings", []) or []
          deployed = d.get("deployed_model", {}) or {}
          masters = d.get("masters", {}) or {}

          lines = []
          lines.append(f"**Snapshot at:** `{now}`")
          lines.append(f"**Overall status:** `{overall}`")
          lines.append("")
          lines.append("### Warnings")
          if warnings:
              for w in warnings:
                  lines.append(f"- {w}")
          else:
              lines.append("- None")
          lines.append("")
          lines.append("### Deployed model")
          if deployed.get("last_trained"):
              lines.append(
                  f"- Last trained: `{deployed.get('last_trained')}` "
                  f"(age {deployed.get('age_hours')}h)"
              )
              cv = deployed.get("cv_performance", {}) or {}
              if cv:
                  lines.append(
                      "- CV AUC - URL: `{u}`, DNS: `{d}`, WHOIS: `{w}`".format(
                          u=cv.get("url_roc_auc", "?"),
                          d=cv.get("dns_roc_auc", "?"),
                          w=cv.get("whois_roc_auc", "?"),
                      )
                  )
              gt = deployed.get("golden_test", {}) or {}
              if gt:
                  lines.append(
                      "- Golden safe-URL accuracy: `{a}`, FPR: `{f}`".format(
                          a=gt.get("safe_url_accuracy", "?"),
                          f=gt.get("false_positive_rate", "?"),
                      )
                  )
          else:
              lines.append(
                  f"- No deployed metadata available: `{deployed.get('error', 'n/a')}`"
              )
          lines.append("")
          lines.append("### Master datasets")
          for m in ("url", "dns", "whois"):
              info = masters.get(m, {}) or {}
              if "error" in info:
                  lines.append(f"- **{m}**: `{info['error']}`")
              else:
                  lines.append(
                      f"- **{m}**: {info.get('size_mb', '?')} MB, "
                      f"age `{info.get('age_hours', '?')}h`"
                  )
          lines.append("")
          lines.append("_Auto-generated by `.github/workflows/health_monitor.yml`._")

          with open("report.md", "w") as f:
              f.write("\n".join(lines))
          PY
          python3 /tmp/make_report.py
          echo "report_ready=true" >> $GITHUB_OUTPUT
          echo "--- report.md ---"
          cat report.md
          echo "-----------------"

      - name: Open or update the health issue (unhealthy path)
        if: steps.status.outputs.overall != 'healthy'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find an existing open issue with the canonical title so we don't
          # spam one per hour. If one exists, add a comment; else open it.
          EXISTING=$(gh issue list --repo "${{ github.repository }}" \
            --state open --search "\"${{ env.ISSUE_TITLE }}\" in:title" \
            --json number --jq '.[0].number' 2>/dev/null || echo "")

          BODY=$(cat report.md)

          if [ -z "$EXISTING" ]; then
            echo "Opening new health issue..."
            # No --label (label may not exist in this repo; we don't want to fail on missing labels)
            gh issue create --repo "${{ github.repository }}" \
              --title "${{ env.ISSUE_TITLE }}" \
              --body "$BODY"
          else
            echo "Updating existing issue #$EXISTING..."
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "$BODY"
          fi

      - name: Close the health issue if system is healthy again
        if: steps.status.outputs.overall == 'healthy'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # If there's an open health issue, close it with a recovery note.
          EXISTING=$(gh issue list --repo "${{ github.repository }}" \
            --state open --search "\"${{ env.ISSUE_TITLE }}\" in:title" \
            --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING" ]; then
            echo "System recovered — closing issue #$EXISTING"
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" \
              --body "✅ System is healthy again. Closing.$(printf '\n\n')$(cat report.md)"
            gh issue close "$EXISTING" --repo "${{ github.repository }}"
          fi
